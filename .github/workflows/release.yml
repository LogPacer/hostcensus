name: Release

# A release is a pushed tag vX.Y.Z that equals the crate version in
# Cargo.toml. It carries one binary per platform, SHA256SUMS, and the
# license files LICENSE, NOTICE and LICENSE-3rdparty.csv.
#
# A pull request that touches the build runs everything up to the checksums
# and publishes nothing. Every binary takes a census on a runner of its own
# platform before it is uploaded, so a target that does not build or does not
# run stops the release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check-release-bundle
      - scripts/release-version
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.crate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the crate version, and refuse a tag that is not it
        id: crate
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(scripts/release-version ${TAG:+"$TAG"})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: hostcensus-linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - asset: hostcensus-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: hostcensus-darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - asset: hostcensus-darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - asset: hostcensus-windows-amd64.exe
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # Recorded in every bundle as tool.commit.
      HOSTCENSUS_COMMIT: ${{ github.sha }}
      # A Windows server need not have the Visual C++ runtime installed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/hostcensus${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/$ASSET"

      - name: Needs no loader and no shared library
        if: runner.os == 'Linux'
        run: |
          file "dist/$ASSET"
          headers="$(readelf --program-headers --dynamic --wide "dist/$ASSET")"
          if grep --extended-regexp 'INTERP|NEEDED' <<<"$headers"; then
            echo "::error::$ASSET is not statically linked"
            exit 1
          fi

      - name: Imports no C runtime library
        if: runner.os == 'Windows'
        run: |
          imports="$(objdump --private-headers "dist/$ASSET" | grep 'DLL Name')"
          echo "$imports"
          if grep --ignore-case --extended-regexp 'vcruntime|msvcp|api-ms-win-crt' <<<"$imports"; then
            echo "::error::$ASSET needs a C runtime that Windows does not ship"
            exit 1
          fi

      - name: Take a census on this runner
        run: |
          "dist/$ASSET" --output "$RUNNER_TEMP/census.json"
          scripts/check-release-bundle "$RUNNER_TEMP/census.json" "$VERSION" "$HOSTCENSUS_COMMIT"

      # The command the README gives, run from a directory of the runner
      # user. Under sudo the bundle belongs to the user who ran it, in a
      # directory of that user's and nowhere else.
      - name: Take a census as root, through sudo
        if: runner.os != 'Windows'
        run: |
          private_and_owned_by() {
            ls -ln "$2"
            [ -n "$(find "$2" -maxdepth 0 -perm 600 -user "$1")" ]
          }
          binary="$PWD/dist/$ASSET"

          mine="$(mktemp -d "$RUNNER_TEMP/mine.XXXXXX")"
          (cd "$mine" && sudo "$binary" --output inventory.json)
          private_and_owned_by "$(id -u)" "$mine/inventory.json"
          scripts/check-release-bundle "$mine/inventory.json" "$VERSION" "$HOSTCENSUS_COMMIT"

          roots="$(sudo mktemp -d "$RUNNER_TEMP/roots.XXXXXX")"
          sudo chmod 0755 "$roots"
          sudo "$binary" --output "$roots/inventory.json"
          private_and_owned_by 0 "$roots/inventory.json"

      # An old distribution, one with another libc, and one with no files at
      # all. The kernel is the runner's in each.
      - name: Take a census on CentOS 7, on Alpine and in an empty image
        if: runner.os == 'Linux'
        run: |
          tar --create --file - --files-from /dev/null | docker import - empty:latest
          for image in centos:7 alpine:3.23 empty:latest; do
            echo "::group::$image"
            docker run --rm --network none --volume "$PWD/dist:/dist:ro" "$image" "/dist/$ASSET" --output - > "$RUNNER_TEMP/census.json"
            scripts/check-release-bundle "$RUNNER_TEMP/census.json" "$VERSION" "$HOSTCENSUS_COMMIT"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write and check SHA256SUMS
        working-directory: dist
        run: |
          sha256sum hostcensus-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check the downloaded files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Add the license files
        run: cp source/LICENSE source/NOTICE source/LICENSE-3rdparty.csv dist/

      # Artifact attestations exist for a private repository only on an
      # enterprise plan, so a release cut while this one is private has none.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Say that this release has no attestation
        if: ${{ github.event.repository.private }}
        run: echo "::warning::No build provenance attestation, because this repository is private."

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes dist/*
